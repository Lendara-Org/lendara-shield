$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: Lendara Shield
  structure:
    - type: space
      key: documentation
      title: Documentation
      path: documentation
      default: true
      content:
        directory: ./documentation
        language: en
    - type: space
      key: documentation-es
      title: Documentación (ES)
      path: es
      content:
        directory: ./es
        language: es
